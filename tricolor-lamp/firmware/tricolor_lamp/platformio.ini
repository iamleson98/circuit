; platformio.ini — PlatformIO alternative to the Makefile
;
; FOR A NOVICE — what is PlatformIO?
;   A build system + package manager for embedded firmware, shipped as a
;   VSCode extension or a `pio` command. It wraps the SAME avr-gcc toolchain
;   underneath; instead of hand-writing rules (like the Makefile), you fill
;   in a form with INI syntax:
;     [env:NAME]   one build configuration (a "environment")
;     key = value  one setting per line
;   Then `pio run` builds, `pio run -t upload` builds + flashes, exactly
;   like `make` / `make flash` next door. Keep whichever you prefer —
;   this file and the Makefile produce the same firmware.
;
; (bare-metal avr-libc — no Arduino framework: the "framework" line that
;  PlatformIO projects usually have is simply absent, so nothing wraps our
;  main(); we are alone in the chip, as the Makefile build is)
[env:attiny85]
platform = atmelavr          ; which chip family + downloads avr-gcc, avr-libc for it
board = attiny85             ; the board definition: pin names, memory sizes (here just the bare chip)
board_build.f_cpu = 1000000L ; the clock rate PlatformIO tells the compiler (same 1 MHz as the Makefile's F_CPU)
upload_protocol = stk500v1   ; how to flash: same Arduino-as-ISP protocol as the Makefile
upload_speed = 19200         ; serial speed of that programmer
upload_flags =               ; extra flags handed to avrdude during upload:
    -P$UPLOAD_PORT           ;   the port (PlatformIO fills $UPLOAD_PORT in)
    -b$UPLOAD_SPEED          ;   the speed (again, so both stay in one place)
board_fuses.lfuse = 0x62     ; the three fuse bytes — identical to `make fuses`:
board_fuses.hfuse = 0xD5     ;   1 MHz clock, brown-out at 2.7 V, keep EEPROM on re-flash
board_fuses.efuse = 0xFF     ;   no bootloader: the app starts at reset, every time
[platformio]
src_dir = .                  ; the firmware sources live in THIS folder (default is src/),
                             ; so the files stay shared with the Makefile build
