; PlatformIO alternative to the Makefile:  pio run  /  pio run -t upload
; (bare-metal avr-libc — no Arduino framework)
[env:attiny85]
platform = atmelavr
board = attiny85
board_build.f_cpu = 1000000L
upload_protocol = stk500v1
upload_speed = 19200
upload_flags =
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED
board_fuses.lfuse = 0x62
board_fuses.hfuse = 0xD5
board_fuses.efuse = 0xFF
[platformio]
src_dir = .
