; platformio.ini — PlatformIO alternative to the Makefile
;   pio run            ≈ make            (build arc_lighter.hex)
;   pio run -t upload  ≈ make flash      (build + flash)
;
; FOR A NOVICE — same idea as the lamp's platformio.ini (see the teaching
; comment there): a form you fill in, instead of hand-written build rules.
; Same avr-gcc underneath; these settings mirror the Makefile one-for-one.
; (bare-metal avr-libc — no Arduino framework: nothing wraps our main())
[env:attiny85]
platform = atmelavr          ; chip family; fetches avr-gcc + avr-libc for it
board = attiny85             ; board definition: the bare chip
board_build.f_cpu = 1000000L ; clock rate given to the compiler (= F_CPU)
build_flags = -DMODULE=0     ; the variant switch: 0 = discrete driver (coil monitor on);
                             ; change to -DMODULE=1 for a complete arc module
upload_protocol = stk500v1   ; flash protocol (Arduino-as-ISP), as in the Makefile
upload_speed = 19200         ; its serial speed
upload_flags =               ; extra avrdude flags at upload time:
    -P$UPLOAD_PORT           ; the port ($UPLOAD_PORT is PlatformIO's placeholder)
    -b$UPLOAD_SPEED          ; the speed again, in one place
[platformio]
src_dir = .                  ; sources live in this folder, shared with the Makefile
